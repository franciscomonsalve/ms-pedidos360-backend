server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders

  profiles:
    active: dev

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:f280f365-653c-4282-b1ee-200e91b01736}/v2.0
          audiences: ${AZURE_API_CLIENT_ID:08c770a5-21a6-4434-8d59-28723c7c759d}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

pedidos360:
  messaging:
    # Kafka (eventos de dominio)
    topic-orders-events: orders.events

    # RabbitMQ (comandos asincronos). UNICA fuente de nombres: la topologia
    # (RabbitTopologyConfig), el publicador y los consumidores de ms-notify
    # leen estas claves; no hay nombres escritos en el codigo.
    rabbit:
      exchanges:
        direct: cmd.direct
        topic: cmd.topic
        dead-letter: cmd.dead.dlx
      queues:
        email:
          name: q.cmd.email
          routing-key: email.send
          topic-prefix: cmd.email
        kitchen:
          name: q.cmd.kitchen
          routing-key: kitchen.ticket
          topic-prefix: cmd.kitchen
        invoice:
          name: q.cmd.invoice
          routing-key: invoice.gen
          topic-prefix: cmd.invoice
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: cloud
  datasource:
    url: jdbc:postgresql://${DB_HOST:pedidos360-db.clslztcqqdgp.us-east-1.rds.amazonaws.com}:${DB_PORT:5432}/${DB_NAME:pedidos360_db}?ssl=true&sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Pedidos360_2026}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

