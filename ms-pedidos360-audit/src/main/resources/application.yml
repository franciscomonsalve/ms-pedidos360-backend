server:
  port: 8084

spring:
  application:
    name: ms-pedidos360-audit
  profiles:
    active: dev

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:f280f365-653c-4282-b1ee-200e91b01736}/v2.0
          audiences: ${AZURE_API_CLIENT_ID:08c770a5-21a6-4434-8d59-28723c7c759d}

  kafka:
    # Los tres brokers. Basta con que uno responda para descubrir el resto del
    # cluster, pero se listan los tres: si el primero esta caido al arrancar,
    # el cliente prueba con el siguiente.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    # El resto de la configuracion del consumidor (deserializadores seguros,
    # reintentos, DLT y concurrencia por particion) esta en KafkaConsumerConfig,
    # porque hacen falta dos fabricas distintas: una por cada tipo de evento.
    # Los group-id se declaran en cada @KafkaListener:
    #   pedidos360-audit     -> orders.events
    #   pedidos360-timeline  -> audit.timeline

pedidos360:
  messaging:
    topic-orders-events: orders.events
    topic-audit-timeline: audit.timeline

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:audit;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: cloud
  # PostgreSQL en RDS, el mismo motor y la misma instancia que usa orders.
  #
  # POR QUE CAMBIO DE ORACLE A POSTGRESQL
  # Este perfil apuntaba a Oracle con ddl-auto: validate, pensado para una base
  # con el esquema ya creado por fuera. En AWS Academy no hay RDS Oracle
  # disponible, y mantener dos motores distintos obligaba a sostener dos
  # dialectos y dos drivers para un servicio que solo escribe una tabla.
  #
  # Comparte la instancia con orders y no colisiona: orders es dueno de PEDIDOS
  # y PEDIDO_ITEMS, este servicio de AUDIT_EVENTS.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos360_db}?ssl=true&sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    # Sin valor por defecto a proposito: si falta la variable el arranque falla
    # de inmediato, en lugar de intentar conectarse con una clave de ejemplo.
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # update y no validate: Hibernate crea AUDIT_EVENTS en el primer arranque.
      # La linea de tiempo deja de ser volatil y sobrevive a los reinicios del
      # contenedor, que es justo lo que se muestra en /auditoria.
      ddl-auto: update
