## Configuracion compartida por los dos nodos del cluster (rabbit1 y rabbit2).
## Se monta en /etc/rabbitmq/rabbitmq.conf en ambos contenedores; el nombre del
## nodo lo da el `hostname:` de cada servicio en docker-compose (rabbit@rabbit1
## y rabbit@rabbit2) y la cookie de Erlang compartida permite que se vean.

## --- Formacion del cluster -------------------------------------------------
## Lista fija de nodos (no hay DNS ni Consul en el EC2). Cada nodo que arranca
## y no tiene datos previos se une al primer nodo de la lista que este vivo.
## rabbit2 arranca despues de rabbit1 (depends_on + healthcheck en el compose)
## para evitar la carrera de arranque simultaneo, que classic_config no cubre.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

## Si se corta la comunicacion entre los nodos, al reconectar se elige una
## particion ganadora y el otro nodo se reinicia solo para resincronizarse.
cluster_partition_handling = autoheal

## --- Acceso ----------------------------------------------------------------
## Por defecto el usuario guest solo puede autenticarse desde loopback. Los
## microservicios conectan desde otros contenedores, asi que se habilita.
## (En un entorno real: usuario propio con RABBITMQ_DEFAULT_USER/PASS.)
loopback_users.guest = false

## --- Limites ---------------------------------------------------------------
## El EC2 es chico y comparte RAM con 5 JVM. Tope duro por nodo en lugar del
## 40% de la RAM del host que usa RabbitMQ por defecto.
vm_memory_high_watermark.absolute = 256MB
