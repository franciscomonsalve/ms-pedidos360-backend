## Nodo 1 del clúster, para el despliegue en Amazon ECS.
##
## Diferencia con infra/rabbitmq/rabbitmq.conf (el de docker-compose): allí los dos nodos
## vivían en contenedores con hostnames propios (rabbit@rabbit1, rabbit@rabbit2) y la red
## interna de Compose los resolvía mutuamente.
##
## En ECS no hay una red así: en bridge los links no admiten ciclos, y en awsvpc no se puede
## fijar el hostname del contenedor. Por eso aquí se usa el método que documenta RabbitMQ para
## correr VARIOS NODOS EN UNA MISMA MÁQUINA: networkMode host, y los nodos se distinguen por
## RABBITMQ_NODENAME y por sus puertos, no por el hostname. Ambos resuelven "localhost", que
## siempre está disponible, y comparten el epmd del host en el 4369.

## --- Formación del clúster -------------------------------------------------
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit1@localhost
cluster_formation.classic_config.nodes.2 = rabbit2@localhost

cluster_partition_handling = autoheal

## --- Puertos de ESTE nodo --------------------------------------------------
## AMQP y la interfaz de gestión. El nodo 2 usa 5673 y 15673.
listeners.tcp.default = 5672
management.tcp.port = 15672

## --- Acceso ----------------------------------------------------------------
## guest solo entra por loopback de fábrica; los microservicios conectan por la red del host.
loopback_users.guest = false

## --- Límites ---------------------------------------------------------------
vm_memory_high_watermark.absolute = 256MB
