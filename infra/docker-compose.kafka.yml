# =============================================================================
#  Arquitectura Kafka: 3 nodos Zookeeper + 3 brokers + Kafka UI.
#
#  POR QUE ZOOKEEPER Y NO KRAFT
#  Kafka 4.x elimino Zookeeper por completo, pero la pauta de EP6 exige mostrar
#  "los tres nodos Zookeeper". Por eso la imagen esta FIJADA en 7.5.3, que es
#  la ultima linea de Confluent que todavia soporta el modo Zookeeper. No usar
#  `latest`: dejaria de arrancar en modo ZK.
#
#  COMO SE LEVANTA
#    Solo Kafka (lo que pide EP5 como "archivo funcional independiente"):
#      docker compose -f docker-compose.kafka.yml up -d
#
#    Todo junto con el stack de RabbitMQ y los microservicios:
#      docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
#
#    Los dos archivos declaran la misma red `pedidos360-net`, asi que al
#    combinarlos los microservicios alcanzan a los brokers por nombre.
#
#  MEMORIA
#  3 Zookeeper + 3 brokers + UI son aprox. 3,2 GB de RSS. En una maquina de
#  16 GB sobra. En el EC2 t3.medium (4 GB) NO cabe junto al resto: alli hay que
#  subir de instancia o agregar swap. Los heaps se controlan abajo con
#  KAFKA_HEAP_OPTS / KAFKA_OPTS, no con mem_limit, por la misma razon que en el
#  compose principal: un OOM-kill del kernel tumbaria el contenedor en plena demo.
#
#  ARRANQUE
#  El ensemble de Zookeeper necesita quorum (2 de 3) antes de que los brokers
#  puedan registrarse. Los healthchecks + depends_on ya lo ordenan; aun asi el
#  arranque completo tarda ~60-90 segundos la primera vez.
# =============================================================================

services:

  # ------------------------------------------------------- Zookeeper (3 nodos)
  # Tres nodos forman un quorum que tolera la caida de UNO. Con dos nodos no
  # habria tolerancia (2 de 2 es mayoria), por eso el numero impar.
  zk1:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: pedidos360-zk1
    hostname: zk1
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      # Zookeeper 3.8 bloquea los comandos de cuatro letras salvo 'srvr'. La
      # variable ZOOKEEPER_4LW_COMMANDS_WHITELIST NO funciona: el convertidor de
      # Confluent no traduce propiedades que empiezan con digito
      # (4lw.commands.whitelist), asi que hay que pasarla como propiedad de la
      # JVM. Sin esto 'ruok' responde "is not executed because it is not in the
      # whitelist" y cualquier healthcheck basado en ruok falla para siempre,
      # dejando a los brokers esperando a unos ZK que en realidad estan sanos.
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=srvr,ruok,stat,mntr
      # El separador es ';' (no coma) en las imagenes de Confluent.
      ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    ports:
      - "2181:2181"
    volumes:
      - zk1-data:/var/lib/zookeeper/data
      - zk1-log:/var/lib/zookeeper/log
    healthcheck:
      # 'srvr' responde aunque la lista de comandos este restringida, asi que el
      # healthcheck no depende de que la propiedad de arriba llegue bien.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q '^Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [pedidos360-net]

  zk2:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: pedidos360-zk2
    hostname: zk2
    environment:
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      # Zookeeper 3.8 bloquea los comandos de cuatro letras salvo 'srvr'. La
      # variable ZOOKEEPER_4LW_COMMANDS_WHITELIST NO funciona: el convertidor de
      # Confluent no traduce propiedades que empiezan con digito
      # (4lw.commands.whitelist), asi que hay que pasarla como propiedad de la
      # JVM. Sin esto 'ruok' responde "is not executed because it is not in the
      # whitelist" y cualquier healthcheck basado en ruok falla para siempre,
      # dejando a los brokers esperando a unos ZK que en realidad estan sanos.
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=srvr,ruok,stat,mntr
      ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    ports:
      - "2182:2181"
    volumes:
      - zk2-data:/var/lib/zookeeper/data
      - zk2-log:/var/lib/zookeeper/log
    healthcheck:
      # 'srvr' responde aunque la lista de comandos este restringida, asi que el
      # healthcheck no depende de que la propiedad de arriba llegue bien.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q '^Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [pedidos360-net]

  zk3:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: pedidos360-zk3
    hostname: zk3
    environment:
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      # Zookeeper 3.8 bloquea los comandos de cuatro letras salvo 'srvr'. La
      # variable ZOOKEEPER_4LW_COMMANDS_WHITELIST NO funciona: el convertidor de
      # Confluent no traduce propiedades que empiezan con digito
      # (4lw.commands.whitelist), asi que hay que pasarla como propiedad de la
      # JVM. Sin esto 'ruok' responde "is not executed because it is not in the
      # whitelist" y cualquier healthcheck basado en ruok falla para siempre,
      # dejando a los brokers esperando a unos ZK que en realidad estan sanos.
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=srvr,ruok,stat,mntr
      ZOOKEEPER_SERVERS: zk1:2888:3888;zk2:2888:3888;zk3:2888:3888
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
    ports:
      - "2183:2181"
    volumes:
      - zk3-data:/var/lib/zookeeper/data
      - zk3-log:/var/lib/zookeeper/log
    healthcheck:
      # 'srvr' responde aunque la lista de comandos este restringida, asi que el
      # healthcheck no depende de que la propiedad de arriba llegue bien.
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q '^Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [pedidos360-net]

  # ---------------------------------------------------------- Kafka (3 brokers)
  # Tres brokers es el minimo para replication.factor=3. Con min.insync.replicas=2
  # y acks=all el cluster tolera la caida de UN broker sin perder escrituras; con
  # dos caidos deja de aceptar escrituras A PROPOSITO, antes que aceptar un dato
  # que podria perderse.
  #
  # DOS LISTENERS, y esto importa:
  #   INTERNAL (29092) -> como se hablan los brokers y los microservicios DENTRO
  #                       de la red de Docker. Se anuncia como kafka1:29092.
  #   EXTERNAL (9092)  -> como llegan los clientes de FUERA (Kafka UI en el
  #                       navegador no, pero si kafkacat o un Spring Boot local).
  #                       Se anuncia con KAFKA_EXTERNAL_HOST, que por defecto es
  #                       localhost y en el EC2 hay que poner la IP publica.
  # Si se anunciara un solo listener, o los brokers no se verian entre si, o los
  # clientes externos recibirian un nombre que no pueden resolver.
  kafka1:
    image: confluentinc/cp-kafka:7.5.3
    container_name: pedidos360-kafka1
    hostname: kafka1
    depends_on:
      zk1: {condition: service_healthy}
      zk2: {condition: service_healthy}
      zk3: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Replicacion de los topicos INTERNOS de Kafka. Sin esto nacen con factor 1
      # y el cluster queda fragil aunque los topicos de negocio esten replicados.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      # Los topicos se crean EXPLICITAMENTE con kafka-topics.sh. Si se crearan
      # solos, naceriian con las particiones y replicas por defecto sin que nadie
      # se entere.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # JMX para que Kafka UI muestre metricas del broker, no solo del topico.
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka1
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "9092:9092"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks: [pedidos360-net]

  kafka2:
    image: confluentinc/cp-kafka:7.5.3
    container_name: pedidos360-kafka2
    hostname: kafka2
    depends_on:
      zk1: {condition: service_healthy}
      zk2: {condition: service_healthy}
      zk3: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka2
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "9093:9093"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks: [pedidos360-net]

  kafka3:
    image: confluentinc/cp-kafka:7.5.3
    container_name: pedidos360-kafka3
    hostname: kafka3
    depends_on:
      zk1: {condition: service_healthy}
      zk2: {condition: service_healthy}
      zk3: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zk1:2181,zk2:2181,zk3:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka3
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "9094:9094"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 45s
    networks: [pedidos360-net]

  # ----------------------------------------------------------------- Kafka UI
  # Administracion visual de brokers, topicos, particiones, mensajes y consumer
  # groups con su LAG. Es la herramienta con la que se demuestran los indicadores
  # de administracion y de metricas de EP6.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pedidos360-kafka-ui
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zk1:2181,zk2:2181,zk3:2181
      # Metricas JMX: sin esto la UI muestra topicos pero no el estado del broker.
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101
      KAFKA_CLUSTERS_0_METRICS_TYPE: JMX
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: -Xmx256m
    ports:
      - "8090:8080"
    networks: [pedidos360-net]

  # --------------------------------------------------- Override de kafka-admin
  # kafka-admin se DEFINE en docker-compose.yml, pero su dependencia de los
  # brokers se declara aqui y no alla, porque kafka1/2/3 solo existen en este
  # archivo: ponerlo en el compose base lo dejaria invalido por si solo.
  #
  # POR QUE HACE FALTA
  # Este servicio construye un AdminClient en un @Bean, y ese cliente resuelve
  # los nombres de bootstrap.servers de forma INMEDIATA. Si arranca antes de que
  # kafka1/2/3 existan en el DNS de Docker, muere con
  # "No resolvable bootstrap urls given in bootstrap.servers" y el contenedor
  # sale con codigo 1, sin reintentar.
  #
  # audit y notify no sufren esto porque los consumidores de Spring Kafka
  # resuelven de forma perezosa y reintentan solos. Solo el AdminClient falla
  # de golpe, y por eso solo el necesita esperar a que los brokers esten sanos.
  kafka-admin:
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:

# Misma red que el compose principal, para que al combinar los dos archivos los
# microservicios alcancen a los brokers por nombre (kafka1:29092).
networks:
  pedidos360-net:
    driver: bridge
